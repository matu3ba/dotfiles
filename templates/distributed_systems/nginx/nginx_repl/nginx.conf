# docker exec -it nginx-k8s nginx -V | grep debug
# nginx -V --with-debug to show debug logs of rewrite rule application
# * to debug use nginx-alpine instead nginx-slim

# error_log /dev/stderr debug; #debug
error_log /dev/stderr notice; #debug

# rewrite_log on; #debug
listen            80;
server_name       127.0.0.0.1;
sendfile          off;  # fix docker/k8s file send

set_real_ip_from  10.0.0.0/8;        # internal default K8s overlay network
set_real_ip_from  127.0.0.1;

real_ip_header    X-Forwarded-For; # strip ips associated to
real_ip_recursive on;              # set_real_ip_from recursively
# alternative without fixed ip address region is to configure envoy and use proxy_protocol
# exclusively on that port to prevent search through ip addresses to find the real client ip address
# envoy
#   annotations:
#     service.beta.kubernetes.io/scw-loadbalancer-proxy-protocol-v2: "true"
# nginx
#   listen 80 proxy_protocol;
#   real_ip_header proxy_protocol;
#   proxy_set_header X-Real-IP $remote_addr;

add_header_inherit merge;
# https://www.w3.org/TR/referrer-policy/
# "no-referrer", "no-referrer-when-downgrade"
# "same-origin", "origin", strict-origin", origin-when-cross-origin"
# "strict-origin-when-cross-origin", "unsafe-url", ""
# strict-origin-when-cross-origin => intern: send full path, extern: naked domain (Keycloak) without any paths or query parameters
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
# against payload misinterpretation of clients
# https://mimesniff.spec.whatwg.org/#mime-type-sniffing-algorithm
# strictly follow server declared content type
add_header X-Content-Type-Options "nosniff" always;
# against clickjacking
# https://www.rfc-editor.org/info/rfc7034/#section-2.1
# specifies what websites can be embedded in own web page via iframe
add_header X-Frame-Options "DENY" always;
# deprecated headers replaced by CSP
# add_header X-XSS-Protection "0" always;
# weaker: add_header X-XSS-Protection "1; mode=block" always;

# https://www.w3.org/TR/CSP3/#csp-directives
#   Fetch Directives ("src" in name): use https://www.w3.org/TR/CSP3/#directive-default-src,
#     so followup entries overwrite defaults according to https://www.w3.org/TR/CSP3/#directive-fallback-list
#   Other Directives
#   Document Directives
#   Navigation Directives
#   Reporting Directives
# keyword-source = "'self'" / "'unsafe-inline'" / "'unsafe-eval'"
#              / "'strict-dynamic'" / "'unsafe-hashes'"
#              / "'report-sample'" / "'unsafe-allow-redirects'"
#              / "'wasm-unsafe-eval'" / "'trusted-types-eval'"
#              / "'report-sha256'" / "'report-sha384'"
#              / "'report-sha512'" / "'unsafe-webtransport-hashes'"
#   https://www.w3.org/TR/CSP3/#directive-default-src best would be 'none' + being explicit; okish is 'self'
#     https://www.w3.org/TR/CSP3/#directive-script-src
#     https://www.w3.org/TR/CSP3/#directive-script-src-elem
#     https://www.w3.org/TR/CSP3/#directive-style-src
#     https://www.w3.org/TR/CSP3/#directive-img-src
#     https://www.w3.org/TR/CSP3/#directive-connect-src
#     https://www.w3.org/TR/CSP3/#directive-frame-src
#     https://www.w3.org/TR/CSP3/#directive-frame-ancestors

# hardening
# strict default policy for static websites
# Content-Security-Policy: default-src 'none'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'; sandbox;
# default-src does not imply: child-src, script-src, style-src, worker-src, webrtc, sandbox

# Stict CSP Best Practice against XSS attacks
# based on https://web.dev/articles/strict-csp?hl=de#fallbacks
# 1. nonce or hashbased CSP?
# * nonce: runtime creation of random number for each script tag
#   - server based rendering of websites
#   Content-Security-Policy:
#     script-src 'nonce-{RANDOM}' 'strict-dynamic';
#     object-src 'none';
#     base-uri 'none';
# * hashbased
#   - static provided html pages or cache saved websites like singla page application (SPA) websites
#   Content-Security-Policy:
#     script-src 'sha256-{HASHED_INLINE_SCRIPT}' 'strict-dynamic';
#     object-src 'none';
#     base-uri 'none';
# 2. select enforcement mode
# * report mode: Content-Security-Policy-Reporty-Only
# * enforcement mode: Content-Security-Policy
# 3. html templates and client code refactoring
# * static hosted SPA Angular: manually add javascript-inline-loader (the thing lazy loading stuff)
#   needs to be added into index.html
# * inline styles and event handler need refactoring
# blocked:  <span onclick="doThings();">A thing.</span>
# good: <span id="things">A thing.</span>
#       <script nonce="${nonce}">
#         document.getElementById('things').addEventListener('click', doThings);
#       </script>
# blocked: <a href="javascript:linkClicked()">foo</a>
# good: <a id="foo">foo</a>
#       <script nonce="${nonce}">
#         document.getElementById('foo').addEventListener('click', linkClicked);
#       </script>
# blocked: eval()
# good: JSON.parse()
# hackaround: 'unsafe-eval'
# 4. support older browsers (>4 years old)
#   - recent browsers ignore unsafe-inline if a CSP nonce or hash is present
#   Content-Security-Policy:
#     script-src 'nonce-{random}' 'strict-dynamic' https: 'unsafe-inline';
#     object-src 'none';
#     base-uri 'none';
# 5. deploy CSP
#   - test with https://csp-evaluator.withgoogle.com/
#   - use "Reporting API" to check what would have been broken
#   - to reploy use Content-Security-Policy response header on
#     server instead of brittle <meta> tag
#   - see https://angular.dev/best-practices/security
#     Content-Security-Policy: require-trusted-types-for 'script'; trusted-types angular angular#bundler;
#     https://www.stackhawk.com/blog/angular-content-security-policy-guide-what-it-is-and-how-to-enable-it/
#     * autoCsp: true
#     * goes more into detail on options
#   - dont use nginx templates due to horrible brittleness
#     * /etc/nginx/templates/my-file.conf.template
#     * script-src 'sha256-${NGINX_ENVIRONMENT_VARIABLE}'
#   - use use custom script for the substitution logic
#     * sed -i "s/__CSP_SCRIPT_HASH__/${CSP_SCRIPT_HASH}/g"
#     * start nginx with env variable NGINX_ENVIRONMENT_VARIABLE
#     * use nginxinc/nginx-unprivileged:stable-slim for write permissions on /etc/nginx/conf.d/, /var/cache/nginx/ etc

# alowing connections to keycloak at 'http://127.0.0.1:8070':
# connect-src 'self' http://127.0.0.1:8070; instead of only self
# add frame-src http://127.0.0.1:8070;
# accept for now not having security against attacks on dom, so for now dont use require-trusted-types-for 'script';
# accept for now shortcoming non-strict CSP for now, so use script-src 'self', script-src-elem 'self' instead of "Stict CSP"
add_header Content-Security-Policy "
    default-src 'none';
    script-src 'self';
    script-src-elem 'self';
    style-src 'self' 'unsafe-inline';
    img-src 'self' data: blob:;
    connect-src 'self' http://127.0.0.1:8070;
    frame-ancestors 'none';
    frame-src http://127.0.0.1:8070;
" always;

server {
    location / {
        root   /usr/share/nginx/html;
        try_files $uri $uri/ /index.html;

        location ~* \.css$ {
            # prevents SPA-fallback for 0-Byte-CSS with nonsensical error
            # Content-Security-Policy script app blocked due to forbidden directive "script-src-elem 'none'
            try_files $uri =404;
            access_log off;
            add_header Cache-Control "public, max-age=31536000, immutable";
        }
    }

    location /api/ {
        # Envoy sets
        # X-Forwarded-Proto: https
        # X-Forwarded-For client_ip_address
        # X-Forwarded-Port: 443
        # :scheme: https

        # proxy_pass rule: /api/ => /
        # rewrite steps
        # /api/alive => /alive
        # with /api/ => . no rewrite happens and backend needs /api/alive
        proxy_pass http://back-k8s:8080/; # pass traffic to proxy
        proxy_set_header Host $host; # RFC 7239: Forwarded: host=..
        proxy_set_header X-Real-IP $remote_addr; # provide ip address of upstream/client
        # https://datatracker.ietf.org/doc/html/rfc7239
        # forward client ip to allow ip rate limiting/geolocalization
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # forward envoy protocol
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;

        proxy_connect_timeout 5s;
        proxy_read_timeout 5s;
    }
}
