# SHENANIGAN Docker/Podman Compose's path resolution is cwd-dependent, making
# it unsuitable for multi-repo setups without workarounds (forces monorepos).

# SHENANIGAN
# Podman/Docker compose has no tooling for diagnostics and tagging
# stateful/stateless containers for use case groups, so automation is error
# prone, requires building from scratch or requires compose file duplication.

# Resulting structure of missing composibility
# * copy paste of compose.yml contents for each service group
# mydockerstuff/
# ├── setup1/
# │  ├── cache/
# │  ├── compose.yml  (contains only immich itself with its own postgres, typesense and redis)
# │  ├── postgres/
# │  ├── upload/
# │  ├── typesense/
# │  ├── redis/
# ├── setup2/
# │  ├── data/
# │  ├── compose.yml  (contains only outline itself with its own postgres and redis)
# │  ├── postgres/
# │  ├── redis/
# ├── setup3/
# │  ├── data/
# │  └── compose.yml  (contains only portainer itself)
# ├── portainer/
# │  ├── data/
# │  └── compose.yml  (contains only portainer itself)
#
# podman compose -f immich/compose.yml up -d
# podman compose -f portainer/compose.yml pull && podman compose -f portainer/compose.yml down && podman compose -f portainer/compose.yml up -d
#
# option 1: local build, tag image, use image from local or gitlab registry
# option 2: use relative paths and pack everything into another compose.yml

# To attach stdin to a process from running podman compose -d:
# version: "3"
# services:
#   app:
#     image: app:1.2.3
#     command:
#       - start-dev
#     stdin_open: true # docker run -i
#     tty: true        # docker run -t

# Alternative: Manually repeating correct startup logic and use: podman run --rm service

# SHENANIGAN Compose can use empty arguments, even though the
# dockerfile docker/podman build would fail with empty ones
# Problem
# ARG COMPOSE_POSSIBLY_EMPTY_STRING_INSTEAD_OF_FAILURE
# Workarounds
# * always default to an invalid value and do check in dockerfile
# * always assume all arguments can be empty string and check in dockerfile
# * do nothing an live with dockerfile+composefile being bad

# SHENANIGAN There is no build system for composing basic steps, so one has to
# use tedious and annoying cli arguments.
# podman compose --env-file .env_kc -f co.yml -f co.frontend.yml run -u root angular npm install
# is too long when I know for configuration "frontend, env ".env_kc" I want
